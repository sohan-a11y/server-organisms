services:
  victim-api:
    build: ./victim-api
    ports:
      - "127.0.0.1:18001:18001"
    volumes:
      - shared-logs:/shared
    environment:
      - SHARED_LOG=/shared/access.log
      - SHARED_DIR=/shared
      - PATCH_FILE=/shared/patched_app.py
      - CANARY_PATCH_FILE=/shared/patched_app.py.canary
      # Required random secret. Generate: python -c "import secrets; print(secrets.token_hex(32))"
      # Copy .env.example to .env and set BROKER_TOKEN there. Compose fails loudly if unset/default.
      - BROKER_TOKEN=${BROKER_TOKEN:?Set BROKER_TOKEN in .env to a random secret - see .env.example}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18001/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  organism:
    build: ./organism
    ports:
      - "127.0.0.1:18002:18002"
    volumes:
      - shared-logs:/shared
    environment:
      - VICTIM_URL=http://victim-api:18001
      - SHARED_LOG=/shared/access.log
      - PATCH_FILE=/shared/patched_app.py
      - CANARY_PATCH_FILE=/shared/patched_app.py.canary
      - BROKER_TOKEN=${BROKER_TOKEN:?Set BROKER_TOKEN in .env to a random secret - see .env.example}
      - META_API_KEY=${META_API_KEY:-}
      - META_MODEL=${META_MODEL:-muse-spark-1.1}
      - META_API_BASE=${META_API_BASE:-https://api.meta.ai/v1}
      - ORGANISM_MODE=${ORGANISM_MODE:-suggest}
      - ORGANISM_STATE_FILE=/shared/organism_state.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      victim-api:
        condition: service_healthy

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "127.0.0.1:18000:18000"
    command: python -m http.server 18000

volumes:
  shared-logs:
